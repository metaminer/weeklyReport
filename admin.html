<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사용자 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #0a0c18; }
    .card { background: #12142a; border: 1px solid rgba(255,255,255,0.06); }
    .sep { border-color: rgba(255,255,255,0.06); }
    select { color-scheme: dark; }
  </style>
</head>
<body class="min-h-screen text-white">
<main class="max-w-2xl mx-auto px-4 py-6 space-y-4">

  <!-- 헤더 -->
  <header class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-[#7c6cf7] to-[#4f7cf7] flex items-center justify-center text-2xl shadow-lg shadow-indigo-900/40">⚙️</div>
      <div>
        <h1 class="text-xl font-bold leading-tight">사용자 관리</h1>
        <p class="text-sm text-[#8b93ac] leading-tight">시스템 관리자</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="index.html" class="w-11 h-11 rounded-full card flex items-center justify-center hover:bg-white/5 transition" title="내 보고서">
        <svg class="w-5 h-5 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      </a>
      <a href="team.html" class="w-11 h-11 rounded-full card flex items-center justify-center hover:bg-white/5 transition" title="팀 보고서">
        <svg class="w-5 h-5 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
      </a>
      <button id="logoutBtn" class="w-11 h-11 rounded-full card flex items-center justify-center hover:bg-white/5 transition" title="로그아웃">
        <svg class="w-5 h-5 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </button>
    </div>
  </header>

  <!-- 사용자 목록 -->
  <div id="userList" class="space-y-2">
    <div class="text-center py-12 text-[#8b93ac] text-sm">불러오는 중...</div>
  </div>

  <!-- 시스템 설정 -->
  <div class="card rounded-2xl px-5 py-5 space-y-4">
    <h2 class="text-sm font-bold">시스템 설정 — 미작성자 리마인드 메일</h2>

    <label class="flex items-center justify-between">
      <span class="text-sm text-[#8b93ac]">리마인드 메일 발송 사용</span>
      <input type="checkbox" id="reminderEnabled" class="w-5 h-5 accent-[#7c6cf7]">
    </label>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium text-[#8b93ac] mb-2">요일</label>
        <select id="reminderWeekday"
          class="w-full bg-[#12142a] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#7c6cf7]/50 transition">
          <option value="0">일요일</option>
          <option value="1">월요일</option>
          <option value="2">화요일</option>
          <option value="3">수요일</option>
          <option value="4">목요일</option>
          <option value="5">금요일</option>
          <option value="6">토요일</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-[#8b93ac] mb-2">시각 (한국 시간)</label>
        <select id="reminderHour"
          class="w-full bg-[#12142a] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#7c6cf7]/50 transition"></select>
      </div>
    </div>

    <p id="settingsStatus" class="text-xs text-[#8b93ac]"></p>
    <p id="settingsError" class="text-xs text-[#fb7185] hidden"></p>

    <button id="saveSettingsBtn"
      class="w-full py-3 text-sm font-semibold bg-gradient-to-br from-[#7c6cf7] to-[#4f7cf7] text-white rounded-xl hover:opacity-90 active:scale-95 transition">
      저장
    </button>
  </div>

</main>

<!-- 편집 모달 -->
<div id="modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden p-4">
  <div class="card rounded-3xl w-full max-w-sm shadow-2xl">
    <div class="flex items-center justify-between px-6 pt-6 pb-2">
      <h3 class="text-base font-bold">사용자 정보 변경</h3>
      <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 transition">
        <svg class="w-4 h-4 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="px-6 pb-6 space-y-4">
      <input type="hidden" id="editUserId">
      <div>
        <label class="block text-sm font-medium text-[#8b93ac] mb-2">이름</label>
        <input type="text" id="editName"
          class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#7c6cf7]/50 focus:bg-white/10 transition">
      </div>
      <div>
        <label class="block text-sm font-medium text-[#8b93ac] mb-2">역할</label>
        <select id="editRole"
          class="w-full bg-[#12142a] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#7c6cf7]/50 transition">
          <option value="member">팀원</option>
          <option value="manager">관리자</option>
          <option value="admin">시스템관리자</option>
        </select>
      </div>
      <p id="editError" class="text-xs text-[#fb7185] hidden"></p>
      <button id="saveEditBtn"
        class="w-full py-3 text-sm font-semibold bg-gradient-to-br from-[#7c6cf7] to-[#4f7cf7] text-white rounded-xl hover:opacity-90 active:scale-95 transition">
        저장
      </button>
    </div>
  </div>
</div>

<script>
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const ROLE_LABEL = { member: '팀원', manager: '관리자', admin: '시스템관리자' };
  const ROLE_COLOR = { member: 'text-[#8b93ac] bg-white/5', manager: 'text-[#7c6cf7] bg-[#7c6cf7]/10', admin: 'text-[#fb7185] bg-[#fb7185]/10' };

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    if (!profile || profile.role !== 'admin') { window.location.href = 'index.html'; return; }
    loadUsers();
    loadSettings();
  }

  const DAY_KR = ['일','월','화','수','목','금','토'];

  function formatDT(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  async function loadSettings() {
    const hourSelect = document.getElementById('reminderHour');
    hourSelect.innerHTML = Array.from({ length: 24 }, (_, h) => `<option value="${h}">${String(h).padStart(2,'0')}:00</option>`).join('');

    const { data: settings, error } = await sb.from('system_settings').select('*').eq('id', 1).single();
    if (error || !settings) {
      document.getElementById('settingsStatus').textContent = '설정을 불러오지 못했습니다.';
      return;
    }
    document.getElementById('reminderEnabled').checked = settings.reminder_enabled;
    document.getElementById('reminderWeekday').value = settings.reminder_weekday;
    document.getElementById('reminderHour').value = settings.reminder_hour;
    const lastSent = settings.last_sent_week_start ? `최근 발송: ${settings.last_sent_week_start} 주` : '아직 발송 이력 없음';
    document.getElementById('settingsStatus').textContent = `${lastSent} · 마지막 저장: ${formatDT(settings.updated_at)}`;
  }

  document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
    const btn = document.getElementById('saveSettingsBtn');
    const err = document.getElementById('settingsError');
    btn.textContent = '저장 중...'; btn.disabled = true;
    err.classList.add('hidden');

    const { error } = await sb.from('system_settings').update({
      reminder_enabled: document.getElementById('reminderEnabled').checked,
      reminder_weekday: Number(document.getElementById('reminderWeekday').value),
      reminder_hour: Number(document.getElementById('reminderHour').value),
      updated_at: new Date().toISOString(),
    }).eq('id', 1);

    if (error) {
      err.textContent = '저장 실패: ' + error.message;
      err.classList.remove('hidden');
    } else {
      await loadSettings();
    }
    btn.textContent = '저장'; btn.disabled = false;
  });

  async function loadUsers() {
    const { data: users } = await sb.from('profiles').select('*').order('name');
    const el = document.getElementById('userList');
    if (!users?.length) {
      el.innerHTML = '<div class="text-center py-12 text-[#8b93ac] text-sm">사용자가 없습니다.</div>';
      return;
    }
    el.innerHTML = users.map(u => `
      <div class="card rounded-2xl px-5 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-[#7c6cf7]/20 flex items-center justify-center text-sm font-bold text-[#7c6cf7]">
            ${u.name.charAt(0)}
          </div>
          <div>
            <p class="text-sm font-semibold">${u.name}</p>
            <p class="text-xs text-[#8b93ac] mt-0.5">${u.id.substring(0,8)}...</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs px-2.5 py-1 rounded-full font-medium ${ROLE_COLOR[u.role]}">${ROLE_LABEL[u.role]}</span>
          <button onclick='openEdit(${JSON.stringify(u)})'
            class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/5 transition text-[#8b93ac] hover:text-white">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          </button>
        </div>
      </div>`).join('');
  }

  function openEdit(user) {
    document.getElementById('editUserId').value = user.id;
    document.getElementById('editName').value = user.name;
    document.getElementById('editRole').value = user.role;
    document.getElementById('editError').classList.add('hidden');
    document.getElementById('modal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('modal').classList.add('hidden');
  }

  document.getElementById('saveEditBtn').addEventListener('click', async () => {
    const btn = document.getElementById('saveEditBtn');
    const err = document.getElementById('editError');
    btn.textContent = '저장 중...'; btn.disabled = true;
    err.classList.add('hidden');

    const { error } = await sb.rpc('update_user_profile', {
      target_id: document.getElementById('editUserId').value,
      new_name: document.getElementById('editName').value.trim(),
      new_role: document.getElementById('editRole').value,
    });

    if (error) {
      err.textContent = '저장 실패: ' + error.message;
      err.classList.remove('hidden');
    } else {
      closeModal();
      loadUsers();
    }
    btn.textContent = '저장'; btn.disabled = false;
  });

  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal')) closeModal();
  });
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut(); window.location.href = 'login.html';
  });

  init();
</script>
</body>
</html>
