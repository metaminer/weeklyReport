<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사업부 주간보고</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config.js"></script>
  <script src="js/holidays.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@14/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <style>
    body { background: #0a0c18; }
    .card { background: #12142a; border: 1px solid rgba(255,255,255,0.06); }
    .sep { border-color: rgba(255,255,255,0.06); }
    .md-body h1 { margin: 0.5em 0 0.25em; font-weight: 700; font-size: 1.5em; }
    .md-body h2 { margin: 0.5em 0 0.25em; font-weight: 700; font-size: 1.25em; }
    .md-body h3 { margin: 0.5em 0 0.25em; font-weight: 700; font-size: 1.1em; }
    .md-body h4,.md-body h5,.md-body h6 { margin: 0.5em 0 0.25em; font-weight: 700; }
    .md-body table { border-collapse: collapse; width: 100%; margin: 0.5em 0; }
    .md-body th, .md-body td { border: 1px solid rgba(255,255,255,0.15); padding: 0.35em 0.75em; text-align: left; font-size: 0.9em; }
    .md-body th { background: rgba(255,255,255,0.05); font-weight: 600; }
    .md-body p { margin: 0.25em 0; }
    .md-body ul { margin: 0.25em 0; padding-left: 1.5em; list-style-type: disc; }
    .md-body ol { margin: 0.25em 0; padding-left: 1.5em; list-style-type: decimal; }
    .md-body li { margin: 0.125em 0; }
    .md-body code { background: rgba(255,255,255,0.08); padding: 0.1em 0.3em; border-radius: 4px; font-size: 0.9em; }
    .md-body pre { background: rgba(255,255,255,0.05); padding: 0.75em; border-radius: 6px; overflow-x: auto; margin: 0.25em 0; }
    .md-body pre code { background: none; padding: 0; }
    .md-body blockquote { border-left: 3px solid rgba(124,108,247,0.5); padding-left: 0.75em; color: #8b93ac; margin: 0.25em 0; }
    .md-body a { color: #9d8ffb; }
    .md-body hr { border-color: rgba(255,255,255,0.06); }
    .md-body strong { font-weight: 700; }
    input[type="date"] { color-scheme: dark; }
    .rz { position: absolute; z-index: 20; }
    .rz-n  { top:-4px;    left:12px;  right:12px; height:8px;  cursor:n-resize; }
    .rz-s  { bottom:-4px; left:12px;  right:12px; height:8px;  cursor:s-resize; }
    .rz-e  { right:-4px;  top:12px;   bottom:12px;width:8px;   cursor:e-resize; }
    .rz-w  { left:-4px;   top:12px;   bottom:12px;width:8px;   cursor:w-resize; }
    .rz-ne { top:-4px;    right:-4px; width:12px; height:12px; cursor:ne-resize; }
    .rz-nw { top:-4px;    left:-4px;  width:12px; height:12px; cursor:nw-resize; }
    .rz-se { bottom:-4px; right:-4px; width:12px; height:12px; cursor:se-resize; }
    .rz-sw { bottom:-4px; left:-4px;  width:12px; height:12px; cursor:sw-resize; }
  </style>
</head>
<body class="min-h-screen text-white">
<main class="max-w-5xl mx-auto px-4 py-6 space-y-4">

  <!-- 헤더 -->
  <header class="flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 sm:gap-3 min-w-0">
      <div class="w-11 h-11 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-br from-[#7c6cf7] to-[#4f7cf7] flex items-center justify-center text-xl sm:text-2xl shadow-lg shadow-indigo-900/40 flex-shrink-0">👥</div>
      <div class="min-w-0">
        <h1 class="text-lg sm:text-xl font-bold leading-tight">팀 보고서</h1>
        <p class="text-sm text-[#8b93ac] leading-tight truncate" id="weekLabel">-</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
      <button id="exportBtn" class="w-9 h-9 sm:w-11 sm:h-11 rounded-full card flex items-center justify-center hover:bg-white/5 transition" title="엑셀 다운로드">
        <svg class="w-5 h-5 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2-9H8a2 2 0 00-2 2v14a2 2 0 002 2h8a2 2 0 002-2V8l-5-5z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 3v5h5"/></svg>
      </button>
      <a href="index.html" class="w-9 h-9 sm:w-11 sm:h-11 rounded-full card flex items-center justify-center hover:bg-white/5 transition" title="내 보고서">
        <svg class="w-5 h-5 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      </a>
      <a id="adminLink" href="admin.html" class="hidden w-9 h-9 sm:w-11 sm:h-11 rounded-full card flex items-center justify-center hover:bg-white/5 transition" title="관리자">
        <svg class="w-5 h-5 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </a>
      <button id="logoutBtn" class="w-9 h-9 sm:w-11 sm:h-11 rounded-full card flex items-center justify-center hover:bg-white/5 transition" title="로그아웃">
        <svg class="w-5 h-5 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </button>
    </div>
  </header>

  <!-- 주차 선택 -->
  <div class="card rounded-2xl px-5 py-3.5 flex items-center justify-between">
    <button id="prevWeekBtn" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-white/5 transition">
      <svg class="w-5 h-5 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div class="text-center">
      <p id="weekRangeLabel" class="text-sm font-semibold">-</p>
      <button id="thisWeekBtn" class="text-xs text-[#7c6cf7] hover:text-[#9d8ffb] mt-0.5 transition">이번 주로</button>
    </div>
    <button id="nextWeekBtn" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-white/5 transition">
      <svg class="w-5 h-5 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <!-- 팀원 목록 -->
  <div id="memberList" class="space-y-3">
    <div class="text-center py-12 text-[#8b93ac] text-sm">불러오는 중...</div>
  </div>

</main>

<!-- 보고서 상세 모달 -->
<div id="modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden p-4">
  <div id="modalBox" class="card rounded-3xl shadow-2xl overflow-hidden flex flex-col" style="width:900px;height:80vh;max-width:calc(100vw - 2rem);max-height:calc(100vh - 2rem);min-width:min(480px, calc(100vw - 2rem));min-height:300px;position:relative;">
    <!-- 리사이즈 핸들 -->
    <div class="rz rz-n"></div><div class="rz rz-s"></div><div class="rz rz-e"></div><div class="rz rz-w"></div>
    <div class="rz rz-ne"></div><div class="rz rz-nw"></div><div class="rz rz-se"></div><div class="rz rz-sw"></div>

    <div class="flex items-center justify-between px-6 py-5 border-b sep flex-shrink-0 card">
      <div>
        <h3 id="modalName" class="text-base font-bold"></h3>
        <p id="modalSavedAt" class="text-xs text-[#8b93ac] mt-0.5"></p>
      </div>
      <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 transition">
        <svg class="w-4 h-4 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="p-4 sm:p-6 overflow-auto flex-1">
      <div class="grid grid-cols-1 sm:grid-cols-2 divide-y sm:divide-y-0 sm:divide-x sep border border-white/10 rounded-2xl overflow-hidden">

        <!-- 금주 실적 -->
        <div>
          <div class="bg-white/3 px-4 py-3 text-center border-b sep">
            <div class="text-xs text-[#8b93ac] mb-0.5">금주 실적</div>
            <div class="text-xs font-semibold" id="modalThisRange">-</div>
          </div>
          <div class="grid grid-cols-[80px_1fr] sm:grid-cols-[150px_1fr] divide-x sep border-b sep">
            <div class="px-2 sm:px-4 py-2 text-xs font-medium text-[#8b93ac] text-center">일자</div>
            <div class="px-2 sm:px-4 py-2 text-xs font-medium text-[#8b93ac] text-center">내용</div>
          </div>
          <div id="modalThisWeek" class="divide-y sep min-h-[60px]"></div>
        </div>

        <!-- 차주 계획 -->
        <div>
          <div class="bg-[#7c6cf7]/10 px-4 py-3 text-center border-b sep">
            <div class="text-xs text-[#8b93ac] mb-0.5">차주 계획</div>
            <div class="text-xs font-semibold" id="modalNextRange">-</div>
          </div>
          <div class="grid grid-cols-[80px_1fr] sm:grid-cols-[150px_1fr] divide-x sep border-b sep">
            <div class="px-2 sm:px-4 py-2 text-xs font-medium text-[#8b93ac] text-center">일자</div>
            <div class="px-2 sm:px-4 py-2 text-xs font-medium text-[#8b93ac] text-center">내용</div>
          </div>
          <div id="modalNextWeek" class="divide-y sep min-h-[60px]"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const DAY_KR = ['일','월','화','수','목','금','토'];

  function getMonday(date = new Date()) {
    const d = new Date(date);
    const day = d.getDay();
    d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
    d.setHours(0,0,0,0);
    return d;
  }
  function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function toYMD(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function toKR(ymd) {
    if (!ymd) return '-';
    const d = new Date(ymd + 'T00:00:00');
    return `${ymd}(${DAY_KR[d.getDay()]})`;
  }
  function formatDT(iso) {
    if (!iso) return '미저장';
    const d = new Date(iso);
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function weekRange(monday) {
    const fri = addDays(monday, 4);
    return `${toYMD(monday)}(${DAY_KR[monday.getDay()]}) ~ ${toYMD(fri)}(${DAY_KR[fri.getDay()]})`;
  }

  function escHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  marked.use({ breaks: true });
  function renderMd(s) {
    if (!s || !s.trim()) return '-';
    return marked.parse(s);
  }

  let viewMonday = getMonday();
  let cachedMembers = [];
  let cachedReports = [];
  let cachedMondayStr = '';
  let cachedLastMondayStr = '';

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    if (!profile || !['manager','admin'].includes(profile.role)) {
      window.location.href = 'index.html'; return;
    }
    if (profile.role === 'admin') document.getElementById('adminLink').classList.remove('hidden');

    await loadWeek();
  }

  async function loadWeek() {
    loadHolidays([viewMonday.getFullYear(), addDays(viewMonday, -7).getFullYear(), addDays(viewMonday, 7).getFullYear()]);

    const fri = addDays(viewMonday, 4);
    document.getElementById('weekRangeLabel').textContent = weekRange(viewMonday);
    document.getElementById('weekLabel').textContent = weekRange(viewMonday);

    const mondayStr = toYMD(viewMonday);
    const lastMondayStr = toYMD(addDays(viewMonday, -7));
    const nextMondayStr = toYMD(addDays(viewMonday, 7));

    // 모든 팀원 조회
    const { data: members } = await sb.from('profiles').select('*').eq('role', 'member').order('name');

    // 이번 주, 지난 주 보고서 한번에 조회
    const { data: reports } = await sb
      .from('reports').select('*, report_plans(*)')
      .in('week_start', [mondayStr, lastMondayStr]);

    // 엑셀 내보내기용 캐시
    cachedMembers = members || [];
    cachedReports = reports || [];
    cachedMondayStr = mondayStr;
    cachedLastMondayStr = lastMondayStr;

    const el = document.getElementById('memberList');
    if (!members?.length) {
      el.innerHTML = '<div class="text-center py-12 text-[#8b93ac] text-sm">팀원이 없습니다.</div>';
      return;
    }

    el.innerHTML = members.map(m => {
      const thisReport = reports?.find(r => r.user_id === m.id && r.week_start === mondayStr);
      // 저장 버튼을 눌렀어도 차주 계획에 실제 내용이 하나도 없으면 "작성완료"로 보지 않는다
      const hasPlan = (thisReport?.report_plans || []).some(p => (p.content || '').trim());
      const saved = hasPlan ? thisReport?.saved_at : null;
      return `
        <div class="card rounded-2xl px-5 py-4 flex items-center justify-between cursor-pointer hover:bg-white/3 transition"
             onclick="openModal('${m.id}', '${m.name}', '${mondayStr}', '${lastMondayStr}')">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-[#7c6cf7]/20 flex items-center justify-center text-sm font-bold text-[#7c6cf7]">
              ${m.name.charAt(0)}
            </div>
            <div>
              <p class="text-sm font-semibold">${m.name}</p>
              <p class="text-xs text-[#8b93ac] mt-0.5">${saved ? '저장: ' + formatDT(saved) : '미작성'}</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs px-2.5 py-1 rounded-full font-medium ${saved ? 'bg-[#7c6cf7]/20 text-[#9d8ffb]' : 'bg-white/5 text-[#8b93ac]'}">
              ${saved ? '작성완료' : '미작성'}
            </span>
            <svg class="w-4 h-4 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </div>
        </div>`;
    }).join('');
  }

  async function openModal(userId, userName, mondayStr, lastMondayStr) {
    const monday = new Date(mondayStr + 'T00:00:00');
    const nextMonday = addDays(monday, 7);

    document.getElementById('modalName').textContent = `${userName}의 주간보고`;
    document.getElementById('modalThisRange').textContent = weekRange(monday);
    document.getElementById('modalNextRange').textContent = weekRange(nextMonday);

    const { data: reports } = await sb
      .from('reports').select('*, report_plans(*)')
      .eq('user_id', userId)
      .in('week_start', [mondayStr, lastMondayStr]);

    const thisReport = reports?.find(r => r.week_start === mondayStr);
    const lastReport = reports?.find(r => r.week_start === lastMondayStr);

    const thisReportHasPlan = (thisReport?.report_plans || []).some(p => (p.content || '').trim());
    document.getElementById('modalSavedAt').textContent = (thisReportHasPlan && thisReport?.saved_at) ? `저장: ${formatDT(thisReport.saved_at)}` : '미작성';

    const thisPlans = (lastReport?.report_plans || []).sort((a,b) => a.sort_order - b.sort_order);
    const nextPlans = (thisReport?.report_plans || []).sort((a,b) => a.sort_order - b.sort_order);

    const renderList = (items, elId, isActual) => {
      const el = document.getElementById(elId);
      if (!items.length) {
        el.innerHTML = '<div class="px-4 py-6 text-sm text-[#8b93ac] text-center">없음</div>';
        return;
      }
      el.innerHTML = items.map((p, i) => {
        const modified = isActual && p.actual_content != null && p.actual_content.trim() !== (p.content || '').trim();
        const shown = modified ? p.actual_content : p.content;
        const uid = `${elId}-${i}`;
        return `
        <div>
          <div class="grid grid-cols-[80px_1fr] sm:grid-cols-[150px_1fr] divide-x sep">
            <div class="px-2 sm:px-4 py-2.5 text-sm ${isHoliday(p.plan_date) ? 'text-red-400' : 'text-[#8b93ac]'} break-words">
              ${toKR(p.plan_date)}
              ${modified ? `<span class="mt-1 block"><span class="inline-block text-[10px] px-1.5 py-0.5 rounded-full bg-amber-400/15 text-amber-300 font-medium">수정됨</span></span>` : ''}
            </div>
            <div class="px-2 sm:px-4 py-2.5 text-sm text-white/80 md-body break-words">${renderMd(shown)}</div>
          </div>
          ${modified ? `
          <div class="px-2 sm:px-4 pb-3">
            <button type="button" onclick="document.getElementById('${uid}').classList.toggle('hidden')" class="text-xs text-[#7c6cf7] hover:text-[#9d8ffb] transition">변경 전/후 비교</button>
            <div id="${uid}" class="hidden mt-2 text-xs text-[#8b93ac] md-body bg-white/5 rounded-lg px-3 py-2 border sep">
              <div class="text-[10px] uppercase tracking-wide text-[#5c6178] mb-1">원래 계획</div>
              ${renderMd(p.content)}
            </div>
          </div>` : ''}
        </div>`;
      }).join('');
    };

    renderList(thisPlans, 'modalThisWeek', true);
    renderList(nextPlans, 'modalNextWeek', false);
    document.getElementById('modal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('modal').classList.add('hidden');
  }

  // 엑셀 시트 이름 제약(31자, \/?*[]: 금지) 처리 + 중복 이름 구분
  function makeSheetName(name, usedNames) {
    let base = (name || '이름없음').replace(/[\\/?*\[\]:]/g, '').slice(0, 31) || '이름없음';
    let candidate = base;
    let n = 2;
    while (usedNames.has(candidate)) {
      const suffix = `(${n})`;
      candidate = base.slice(0, 31 - suffix.length) + suffix;
      n++;
    }
    usedNames.add(candidate);
    return candidate;
  }

  function memberRows(m) {
    const thisReport = cachedReports.find(r => r.user_id === m.id && r.week_start === cachedMondayStr);
    const lastReport = cachedReports.find(r => r.user_id === m.id && r.week_start === cachedLastMondayStr);

    const thisPlans = (lastReport?.report_plans || []).sort((a, b) => a.sort_order - b.sort_order); // 금주 실적
    const nextPlans = (thisReport?.report_plans || []).sort((a, b) => a.sort_order - b.sort_order); // 차주 계획

    const rows = [];
    thisPlans.forEach(p => {
      const modified = p.actual_content != null && p.actual_content.trim() !== (p.content || '').trim();
      rows.push({
        '구분': '금주 실적',
        '일자': p.plan_date || '',
        '요일': p.plan_date ? DAY_KR[new Date(p.plan_date + 'T00:00:00').getDay()] : '',
        '내용': (modified ? p.actual_content : p.content) || '',
        '수정여부': modified ? '수정됨' : '',
        '원래계획': modified ? (p.content || '') : '',
      });
    });
    nextPlans.forEach(p => {
      rows.push({
        '구분': '차주 계획',
        '일자': p.plan_date || '',
        '요일': p.plan_date ? DAY_KR[new Date(p.plan_date + 'T00:00:00').getDay()] : '',
        '내용': p.content || '',
        '수정여부': '',
        '원래계획': '',
      });
    });
    if (!rows.length) {
      rows.push({ '구분': '-', '일자': '', '요일': '', '내용': '(작성 없음)', '수정여부': '', '원래계획': '' });
    }
    return rows;
  }

  // SheetJS(xlsx)의 무료 버전은 쓰기 시 셀 스타일(wrapText 등)을 저장하지 못해서
  // \n을 넣어도 엑셀에서 한 줄로 뭉개져 보였다. 스타일 저장을 지원하는 ExcelJS로 교체.
  async function exportExcel() {
    if (!cachedMembers.length) {
      alert('내보낼 팀원 데이터가 없습니다.');
      return;
    }

    const wb = new ExcelJS.Workbook();
    const usedNames = new Set();

    for (const m of cachedMembers) {
      const sheet = wb.addWorksheet(makeSheetName(m.name, usedNames));
      sheet.columns = [
        { header: '구분', key: 'type', width: 10 },
        { header: '일자', key: 'date', width: 12 },
        { header: '요일', key: 'day', width: 6 },
        { header: '내용', key: 'content', width: 60 },
        { header: '수정여부', key: 'modified', width: 8 },
        { header: '원래계획', key: 'original', width: 60 },
      ];
      sheet.getRow(1).font = { bold: true };

      memberRows(m).forEach(r => sheet.addRow({
        type: r['구분'], date: r['일자'], day: r['요일'],
        content: r['내용'], modified: r['수정여부'], original: r['원래계획'],
      }));

      // 내용/원래계획 컬럼은 개행이 그대로 여러 줄로 보이도록 줄바꿈 텍스트를 켠다.
      sheet.getColumn('content').alignment = { wrapText: true, vertical: 'top' };
      sheet.getColumn('original').alignment = { wrapText: true, vertical: 'top' };
    }

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `팀주간보고_${cachedMondayStr}.xlsx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  document.getElementById('exportBtn').addEventListener('click', exportExcel);

  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal') && !wasResizing) closeModal();
    wasResizing = false;
  });
  document.getElementById('prevWeekBtn').addEventListener('click', () => {
    viewMonday = addDays(viewMonday, -7); loadWeek();
  });
  document.getElementById('nextWeekBtn').addEventListener('click', () => {
    viewMonday = addDays(viewMonday, 7); loadWeek();
  });
  document.getElementById('thisWeekBtn').addEventListener('click', () => {
    viewMonday = getMonday(); loadWeek();
  });
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut(); window.location.href = 'login.html';
  });

  init();

  // 모달 리사이즈
  let wasResizing = false;
  (function() {
    const box = document.getElementById('modalBox');
    let dir = null, sx, sy, sw, sh;

    box.querySelectorAll('.rz').forEach(handle => {
      handle.addEventListener('mousedown', e => {
        e.preventDefault();
        dir = [...handle.classList].find(c => c.startsWith('rz-') && c !== 'rz').replace('rz-', '');
        sx = e.clientX; sy = e.clientY;
        sw = box.offsetWidth; sh = box.offsetHeight;
        document.body.style.userSelect = 'none';
      });
    });

    document.addEventListener('mousemove', e => {
      if (!dir) return;
      wasResizing = true;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      const minW = 480, minH = 300;
      if (dir.includes('e')) box.style.width  = Math.max(minW, sw + dx) + 'px';
      if (dir.includes('s')) box.style.height = Math.max(minH, sh + dy) + 'px';
      if (dir.includes('w')) box.style.width  = Math.max(minW, sw - dx) + 'px';
      if (dir.includes('n')) box.style.height = Math.max(minH, sh - dy) + 'px';
    });

    document.addEventListener('mouseup', () => {
      dir = null;
      document.body.style.userSelect = '';
    });
  })();
</script>
</body>
</html>
